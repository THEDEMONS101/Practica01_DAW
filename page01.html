<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page01 · Formulario</title>
  <link rel="stylesheet" href="css/page01.css">
</head>
<body>
  <main class="window">
    <h1 class="sr-only">Formulario de registro</h1>
    <div class="toolbar" aria-label="Iconos de la ventana">
      <svg viewBox="0 0 24 24" role="img" aria-label="Brillo"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
      <svg viewBox="0 0 24 24" role="img" aria-label="Diseño"><path d="m3 5 7 14 4-7h-4l3-7H3Zm12 0h6l-5 9-2-4" fill="currentColor" stroke="none"/></svg>
      <svg viewBox="0 0 24 24" role="img" aria-label="Portapapeles"><path d="M8 5H5v16h13v-3M10 4H8v13h13V4h-5"/><rect x="10" y="2" width="6" height="5" rx="1"/></svg>
      <svg viewBox="0 0 24 24" role="img" aria-label="Código"><path d="m8 7-5 5 5 5m8-10 5 5-5 5"/></svg>
    </div>
    <form id="registration-form">
      <div class="field">
        <input id="name" name="name" type="text" placeholder=" " autocomplete="name" required>
        <label for="name">Name</label>
      </div>
      <div class="field">
        <input id="email" name="email" type="email" placeholder=" " autocomplete="email" required>
        <label for="email">E-mail</label>
      </div>
      <div class="field">
        <input id="item" name="item" type="text" placeholder=" " list="items" required>
        <label for="item">Item</label>
        <datalist id="items"><option value="Laptop"></option><option value="Monitor"></option><option value="Teclado"></option></datalist>
      </div>
      <label class="image-field" id="image-drop" for="image">
        <input class="image-input" id="image" name="image" type="file" accept="image/*" aria-label="Seleccionar o arrastrar una imagen" aria-describedby="image-help image-path">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 3-3 6 6"/></svg>
      </label>
      <p class="image-help" id="image-help">Arrastra una imagen o haz clic para seleccionarla.</p>
      <p class="image-path" id="image-path" aria-live="polite"></p>
      <label class="agreement"><input type="checkbox" name="agreement" required> <span>Do you agree?</span></label>
      <div class="actions"><button type="submit">Submit</button><button type="reset">Clear</button></div>
      <p class="status" id="form-status" role="status"></p>
      <noscript><p class="image-help">Activa JavaScript para arrastrar imágenes y validar el formulario sin salir de esta página.</p></noscript>
    </form>
  </main>
</body>
</html>
